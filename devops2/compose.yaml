services:
  app:
    build:
      context: .
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./configs/config.docker.yaml:/app/configs/config.yaml:ro
      - app-uploads:/app/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fileserver
      POSTGRES_PASSWORD: fileserver
      POSTGRES_DB: file_server
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileserver -d file_server"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  app-uploads:
  mongo-data:
  postgres-data:
  redis-data:
