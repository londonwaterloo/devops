server:
  host: "0.0.0.0"
  port: 8080

storage:
  upload_dir: "./data/uploads"
  max_file_size: 10485760

templates:
  dir: "./internal/infrastructure/web/templates"

mongodb:
  uri: "mongodb://mongo:27017"
  database: "file_server"
  collection: "files"

postgres:
  host: "postgres"
  port: 5432
  user: "fileserver"
  password: "fileserver"
  dbname: "file_server"
  sslmode: "disable"

redis:
  addr: "redis:6379"
